<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VETA Grill Steakhouse Barcelona</title>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WT68GQH3PY"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-WT68GQH3PY');

    // -----------------------------------------
    // CONFIGURACIÓN DE TARJETAS NFC
    // -----------------------------------------

    const cards = {
      "veta-01": {
        card_id: "VETA-01",
        card_name: "Arturo"
      },

      "veta-02": {
        card_id: "VETA-02",
        card_name: "Carol"
      },

      "veta-03": {
        card_id: "VETA-03",
        card_name: "Valentina"
      },

      "veta-04": {
        card_id: "VETA-04",
        card_name: "Dario"
      },

      "veta-05": {
        card_id: "VETA-05",
        card_name: "Belen"
      }
    };

    // -----------------------------------------
    // DETECTAR TARJETA NFC
    // -----------------------------------------

    const params = new URLSearchParams(window.location.search);

    const nfcId = params.get("nfc");

    const card = cards[nfcId];

    // -----------------------------------------
    // ENVIAR EVENTO A GOOGLE ANALYTICS
    // -----------------------------------------

    if (card) {

      gtag('event', 'nfc_tap', {

        restaurant: 'veta',

        restaurant_name: 'VETA Grill Steakhouse Barcelona',

        card_id: card.card_id,

        card_name: card.card_name,

        nfc_id: nfcId,

        source: 'nfc',

        debug_mode: true

      });

    } else {

      // Visita sin tarjeta NFC

      gtag('event', 'page_without_nfc', {

        restaurant: 'veta',

        restaurant_name: 'VETA Grill Steakhouse Barcelona',

        source: 'website'

      });

    }

    // -----------------------------------------
    // REDIRECCIÓN A GOOGLE MAPS
    // -----------------------------------------

    setTimeout(function () {

      window.location.href =
        "https://www.google.com/maps/place//data=!4m3!3m2!1s0x12a4a30018c23335:0xe28d19552d1b78ea!12e1";

    }, 1500);

  </script>

</head>

<body>

  <div style="
    font-family: Arial, sans-serif;

    </p>

  </div>

</body>

</html>
