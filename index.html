<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prueba NFC</title>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WT68GQH3PY"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-WT68GQH3PY');

    const cards = {
      "veta-01": {
        card_id: "VETA-01",
        card_name: "Arturo"
      },
      "veta-02": {
        card_id: "VETA-02",
        card_name: "Carol"
      },
      "veta-03": {
        card_id: "VETA-03",
        card_name: "Valentina"
      },
      "veta-04": {
        card_id: "VETA-04",
        card_name: "Dario"
      },
      "veta-05": {
        card_id: "VETA-05",
        card_name: "Belen"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const nfcId = params.get("nfc");
    const card = cards[nfcId];

    if (card) {

      gtag('event', 'nfc_tap', {
        restaurant: 'veta',
        restaurant_name: 'VETA Grill Steakhouse Barcelona',
        card_id: card.card_id,
        card_name: card.card_name,
        nfc_id: nfcId,
        source: 'nfc',
        debug_mode: true
      });

    }
  </script>

</head>

<body>

  <div style="
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 60px 20px;
  ">

    <h1>VETA NFC</h1>

    <p id="status">Procesando...</p>

  </div>

  <script>

    const status = document.getElementById("status");

    if (card) {

      status.innerHTML =
        "Tarjeta detectada: <strong>" +
        card.card_id +
        "</strong><br><br>" +
        "Persona: <strong>" +
        card.card_name +
        "</strong><br><br>" +
        "Evento enviado a Google Analytics.";

    } else {

      status.innerHTML =
        "No se detectó ninguna tarjeta NFC.";

    }

  </script>

</body>

</html>
